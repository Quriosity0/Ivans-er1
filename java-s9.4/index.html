<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="page">
        <h1 class="title">Таймер</h1>
        <div class="timer">
            <div class="timer_box">
                <p id="day">20</p>
                <p class="text">Дней</p>
            </div>
            <div class="timer_box">
                <p id="hours">20</p>
                <p class="text">часов</p>
            </div>
            <div class="timer_box">
                <p id="min">20</p>
                <p class="text">Минут</p>
            </div>
            <div class="timer_box">
                <p id="sec">20</p>
                <p class="text">Секунд</p>
            </div>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
